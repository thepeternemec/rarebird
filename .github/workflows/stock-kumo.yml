name: S&P 500 Kumo verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/kumo-stocks/**'
      - 'apps/api/src/lib/stock-kumo-store.ts'
      - '.github/workflows/stock-kumo.yml'
permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/kumo-stocks -p 'test_*.py' -v
  engine:
    needs: preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/kumo-stocks/requirements.txt
      - name: Install pinned Kumo Engine and CPU PyTorch
        run: |
          python -m pip install 'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/kumo-stocks/requirements.txt
      - name: Fit and score actual Kumo on isolated synthetic data
        run: python scripts/kumo-stocks/smoke.py
