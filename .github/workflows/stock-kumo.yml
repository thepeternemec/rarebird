name: S&P 500 Kumo verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/kumo-stocks/**'
      - 'deploy/stock-kumo.compose.yml'
      - 'apps/api/src/lib/stock-kumo-store.ts'
      - '.github/workflows/stock-kumo.yml'
permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/kumo-stocks -p 'test_*.py' -v
  engine:
    needs: preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployable CPU worker image
        run: docker build --tag rarebird-stock-kumo:ci scripts/kumo-stocks
      - name: Fit and score actual Kumo in the deployment image
        run: docker run --rm --network none --entrypoint python rarebird-stock-kumo:ci /app/smoke.py
      - name: Validate the deployment manifest without starting a service
        env:
          RAREBIRD_STOCK_MODEL_SECRET: synthetic-compose-validation-only
        run: docker compose -f deploy/stock-kumo.compose.yml config --quiet
