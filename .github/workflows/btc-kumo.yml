name: BTC Kumo pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/kumo-btc/**'
      - 'apps/api/src/lib/btc-pilot.ts'
      - 'packages/contracts/src/btc-pilot.ts'
      - '.github/workflows/btc-kumo.yml'
  pull_request:
    paths:
      - 'scripts/kumo-btc/**'
      - 'apps/api/src/lib/btc-pilot.ts'
      - 'packages/contracts/src/btc-pilot.ts'
      - '.github/workflows/btc-kumo.yml'
  schedule:
    - cron: '3 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: btc-kumo-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify point-in-time preparation and paired measurements
        run: python -m unittest discover -s scripts/kumo-btc -p 'test_*.py' -v

  model-smoke:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/kumo-btc/requirements.txt
      - name: Install pinned Kumo and CPU PyTorch
        run: |
          python -m pip install 'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/kumo-btc/requirements.txt
      - name: Exercise the Kumo graph, fit and prediction APIs on synthetic rows
        run: python scripts/kumo-btc/smoke.py

  measure:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/kumo-btc/requirements.txt

      - name: Restore the previous prospective journal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p previous output
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=btc-kumo-state&per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")][0].id // empty')
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > previous.zip
            python - <<'PY'
          import json, zipfile
          from pathlib import Path
          with zipfile.ZipFile("previous.zip") as archive:
              matches = [name for name in archive.namelist() if name.split("/")[-1] == "journal.json"]
              if len(matches) != 1:
                  raise ValueError("Previous artifact must contain one journal")
              journal = json.loads(archive.read(matches[0]))
              if journal.get("version") != "btc-kumo-v1":
                  raise ValueError("Previous journal has an unexpected version")
              Path("previous/journal.json").write_text(json.dumps(journal))
          PY
          fi

      - name: Audit live BTC data and measure the recorded baseline
        id: audit
        run: |
          python scripts/kumo-btc/pilot.py --download --dataset output/dataset.json --output output --prepare-only
          python - <<'PY'
          import json, os
          report = json.load(open("output/report.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as file:
              file.write("training_ready=" + str(report["training_ready"]).lower() + "\n")
          PY

      - name: Install CPU model dependencies
        id: install
        if: steps.audit.outputs.training_ready == 'true'
        run: |
          python -m pip install 'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/kumo-btc/requirements.txt

      - name: Fit the bounded Kumo experiment and record eligible future predictions
        id: train
        if: steps.audit.outputs.training_ready == 'true'
        run: python scripts/kumo-btc/pilot.py --dataset output/dataset.json --output output

      - name: Publish measurement summary
        if: always()
        env:
          INSTALL_STATUS: ${{ steps.install.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("output/report.json")
          if not path.exists():
              print("The BTC dataset could not be measured. See the failed step.")
              raise SystemExit(0)
          report = json.loads(path.read_text())
          if os.environ["INSTALL_STATUS"] == "failure":
              report["status"] = "model_runtime_unavailable"
              report["reason"] = "Kumo dependencies could not be installed. Baseline measurements were retained."
              path.write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as file:
              file.write("# BTC Kumo pilot\n\n")
              file.write("Status " + report["status"] + "\n\n")
              file.write("Eligible resolved hours " + str(report["resolved_hours"]) + "\n\n")
              file.write("| Measurement | Scored hours | Kumo Brier | Existing Brier | Base-rate Brier |\n| --- | --- | --- | --- | --- |\n")
              for title, key in [("Recorded baseline", "baseline_measurements"), ("Historical held-out", "retrospective"), ("Prospective", "prospective")]:
                  row = report[key]
                  file.write(f"| {title} | {row['scored']} | {row['kumo_brier']} | {row['existing_brier']} | {row['base_rate_brier']} |\n")
              if report.get("reason"):
                  file.write("\n" + report["reason"] + "\n")
              file.write("\n" + report["note"] + "\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-kumo-state
          path: |
            output/journal.json
            output/report.json
            output/model.json
          if-no-files-found: warn
          retention-days: 90
